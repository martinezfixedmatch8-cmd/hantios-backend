name: CI

# Batch 8 Session B (HNT-TEST-001). Confirmed absent before this session --
# no .github/workflows/ directory existed at all.
#
# Deliberately the plain pull_request trigger, never its own "_target"
# variant -- this repo is genuinely public (confirmed directly against the
# live GitHub page during Phase 0), so a fork PR is a real, live
# possibility, not a hypothetical. The plain trigger gives a fork PR's run
# a read-only GITHUB_TOKEN and NO access to repository secrets by default;
# the "_target" variant runs in the base repo's own secret-bearing context
# while typically checking out the fork's own untrusted code -- exactly the
# exploited class of Actions vulnerability this avoids by construction, not
# by a runtime check. (tests/ciWorkflow.unit.test.ts asserts the banned
# trigger name never appears literally anywhere in this file, including in
# comments -- worded this way so this explanation doesn't trip its own
# check, the same self-referential class of false positive already
# documented for emailArchitectureLock.unit.test.ts.)
on:
  pull_request:

# A second concurrent push to the same PR cancels the still-running check
# for the prior one -- avoids piling up ephemeral Neon branches for
# superseded commits.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Fork-safe: runs for EVERY pull_request event, same-repo or fork alike.
  # No secret is referenced anywhere in this job -- not filtered at
  # runtime, structurally absent from this job's own step definitions.
  # DATABASE_URL/JWT_* below are hardcoded placeholder strings (not
  # `secrets.*`), present only so src/lib/config.ts's Zod schema (which
  # requires non-empty values, loaded transitively by importing src/app.ts)
  # doesn't reject module load -- no real database is ever contacted by
  # anything this job runs.
  checks:
    name: Checks (no secrets, all PRs incl. forks)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      JWT_ACCESS_SECRET: "placeholder-access-secret-at-least-32-chars-long"
      JWT_REFRESH_SECRET: "placeholder-refresh-secret-at-least-32-chars-long"
      JWT_OTP_SECRET: "placeholder-otp-secret-at-least-32-characters-long"
      JWT_RESET_SECRET: "placeholder-reset-secret-at-least-32-chars-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      # A curated, explicit allowlist of test files confirmed (by direct
      # import-graph inspection during Phase 0) to never import src/app.ts,
      # src/lib/prisma.ts, or any DB-touching test helper -- these exercise
      # pure functions only, so they're genuinely safe to run against the
      # placeholder DATABASE_URL above (module load succeeds; nothing ever
      # attempts a real query). Deliberately NOT "every *.unit.test.ts file"
      # -- that would silently include a future unit test that DOES need a
      # real DB the moment someone adds one, without this list's own author
      # re-verifying it belongs here.
      - name: Run DB-free unit tests
        run: >
          npx jest --runInBand
          tests/businessTime.unit.test.ts
          tests/ciWorkflow.unit.test.ts
          tests/countryReference.unit.test.ts
          tests/emailArchitectureLock.unit.test.ts
          tests/emailProviderSelection.unit.test.ts
          tests/emailTemplateRenderer.unit.test.ts
          tests/inboundEmailCorrelation.unit.test.ts
          tests/interestEngine.unit.test.ts
          tests/messageTemplates.unit.test.ts
          tests/password.unit.test.ts
          tests/phoneNormalization.unit.test.ts
          tests/receiptRenderer.unit.test.ts
          tests/resendEmailProvider.unit.test.ts
          tests/resendWebhookVerification.unit.test.ts
          tests/stockAlerts.unit.test.ts

  # Same-repo PRs only -- github.event.pull_request.head.repo.full_name
  # differs from github.repository exactly when the PR's head is a fork.
  # Shows as a genuinely SKIPPED job in the Actions UI for a fork PR, not a
  # silent no-op.
  provision-db:
    name: Provision ephemeral Neon test branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      branch_id: ${{ steps.create.outputs.branch_id }}
      db_host: ${{ steps.create.outputs.db_host }}
      db_name: ${{ steps.create.outputs.db_name }}
      db_role: ${{ steps.create.outputs.db_role }}
    steps:
      - name: Ensure psql and jq are available
        run: |
          set -euo pipefail
          command -v jq >/dev/null || sudo apt-get update -y && sudo apt-get install -y jq
          command -v psql >/dev/null || (sudo apt-get update -y && sudo apt-get install -y postgresql-client)

      - name: Create ephemeral branch (Neon Management API)
        id: create
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_CI_TEST_API_TOKEN }}
          # Repository VARIABLE (not a secret -- project ids aren't
          # sensitive), set separately in repo Settings > Variables.
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
        run: |
          set -euo pipefail
          BRANCH_NAME="ci-pr-${{ github.event.number }}-${{ github.run_id }}"
          RESPONSE_WITH_STATUS=$(curl -sS -w "\n%{http_code}" -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":{\"name\":\"${BRANCH_NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          HTTP_STATUS=$(echo "$RESPONSE_WITH_STATUS" | tail -n1)
          RESPONSE=$(echo "$RESPONSE_WITH_STATUS" | sed '$d')

          BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branch.id')
          DB_HOST=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_parameters.host')
          DB_NAME=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_parameters.database')
          DB_ROLE=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_parameters.role')
          DB_PASSWORD=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_parameters.password')
          # Confirmed via Neon's own createProjectBranch API reference: the
          # response's operations array includes a "start_compute" entry
          # (alongside create_branch/create_compute) with its own id/status
          # -- this is the real, authoritative readiness signal the next
          # step polls, never guessed from the operation's own id alone.
          # Not a secret -- operation ids aren't sensitive.
          START_COMPUTE_OPERATION_ID=$(echo "$RESPONSE" | jq -r '.operations[]? | select(.action == "start_compute") | .id')

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            # Safe, minimal diagnostics only -- the HTTP status code itself is
            # never sensitive, and Neon's own standard error shape's
            # "message"/"code" fields are printed on their own, never the
            # full raw response (which could echo back request fields) and
            # never anything under connection_uris (credentials).
            echo "Neon branch-creation HTTP status: ${HTTP_STATUS}"
            ERROR_MESSAGE=$(echo "$RESPONSE" | jq -r '.message // empty')
            ERROR_CODE=$(echo "$RESPONSE" | jq -r '.code // empty')
            if [ -n "$ERROR_MESSAGE" ]; then
              echo "Neon error message: ${ERROR_MESSAGE}"
            fi
            if [ -n "$ERROR_CODE" ]; then
              echo "Neon error code: ${ERROR_CODE}"
            fi
            echo "::error::Neon branch creation did not return a branch id -- aborting, nothing to clean up."
            exit 1
          fi

          # Mask BEFORE ever echoing/using again -- add-mask applies to the
          # rest of this whole workflow run's log stream, including in
          # downstream jobs that reference the same value via outputs.
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${DB_HOST}"

          {
            echo "branch_id=${BRANCH_ID}"
            echo "db_host=${DB_HOST}"
            echo "db_name=${DB_NAME}"
            echo "db_role=${DB_ROLE}"
            echo "start_compute_operation_id=${START_COMPUTE_OPERATION_ID}"
          } >> "$GITHUB_OUTPUT"

          # db_password is deliberately NOT a job output (job outputs, even
          # masked ones, are visible in the run's own Summary UI as `***`
          # rather than being withheld entirely) -- instead written straight
          # into this step's own masked env for use two steps below, in
          # THIS job only. Downstream jobs never see it at all.
          echo "DB_PASSWORD=${DB_PASSWORD}" >> "$GITHUB_ENV"

      - name: Wait for compute to be ready (poll start_compute operation)
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_CI_TEST_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          OPERATION_ID: ${{ steps.create.outputs.start_compute_operation_id }}
        run: |
          set -euo pipefail
          # Real readiness mechanism, not a guess: the prior "warm-up" step
          # here used to blindly retry a psql SELECT 1 on a timer, hoping
          # DNS/compute-readiness happened to line up -- diagnostics added
          # to that loop then proved the actual failure was a DNS lookup
          # never resolving, unrelated to how long we waited. This polls
          # Neon's own Management API operation status instead (confirmed
          # via their createProjectBranch/getProjectOperation API
          # references: the branch-creation response's own operations
          # array includes a start_compute entry with real, authoritative
          # status values -- scheduling/running/finished/failed/error/
          # cancelling/cancelled/skipped), which is what Neon's own MCP
          # server's create_branch tool does under the hood too ("waits
          # until it is ready", confirmed from its own source to use a
          # bounded wait against the Management API, not a blind
          # connection retry -- matching the ~13s real readiness already
          # observed through that tool).
          #
          # 120s budget: matches Neon's own MCP server's evidenced
          # WAIT.timeoutMs = 120_000 for this exact "waits until ready"
          # behavior (mcp/tools/generated/adapt.ts in
          # neondatabase/mcp-server-neon) -- reusing their own real number
          # rather than a fresh guess. Checked every 4s (~30 checks over
          # the budget): frequent enough to return promptly the moment the
          # operation actually finishes, not so frequent as to hammer the
          # Management API for a bounded async job that doesn't need
          # exponential backoff the way a cold, unbounded external
          # dependency (like the old DNS-retry loop) did.
          if [ -z "$OPERATION_ID" ] || [ "$OPERATION_ID" = "null" ]; then
            echo "::error::No start_compute operation id was returned by branch creation -- cannot confirm readiness, aborting."
            exit 1
          fi

          DEADLINE=$(( $(date +%s) + 120 ))
          while true; do
            # Tolerate a transient failure reaching Neon's own Management
            # API here -- this is a call to Neon's control plane, not to
            # the ephemeral branch itself, and a single dropped request
            # must not abort the whole step under set -e. `|| true` keeps
            # the substitution's own exit status 0 regardless of curl's;
            # an empty/non-JSON response then falls back to "unknown"
            # rather than letting a jq parse failure crash the script the
            # same way. "unknown" matches neither "finished" nor the
            # terminal-failure case list below, so it simply falls through
            # to the existing deadline check and another 4s poll -- the
            # 120s deadline and the terminal-status checks stay the real
            # safety bounds either way; this only stops one bad poll
            # attempt from ending the loop early.
            OP_RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/operations/${OPERATION_ID}" \
              -H "Authorization: Bearer ${NEON_API_TOKEN}" || true)
            if [ -z "$OP_RESPONSE" ]; then
              OP_STATUS="unknown"
            else
              OP_STATUS=$(echo "$OP_RESPONSE" | jq -r '.operation.status // "unknown"' 2>/dev/null || echo "unknown")
            fi

            if [ "$OP_STATUS" = "finished" ]; then
              echo "start_compute operation finished -- compute is active."
              exit 0
            fi

            # failed/error/cancelled/skipped are all real terminal outcomes
            # that will never become "finished" no matter how long we wait
            # -- surface immediately as an error rather than burning the
            # rest of the 120s budget (or the next step's own psql retry
            # budget) on something that can't succeed. "skipped" is
            # included here as a judgment call, not a documented failure
            # state: Neon's docs don't say what it means for this specific
            # operation type, so it's treated the same as a genuine
            # failure rather than guessed as an implicit success.
            # "cancelling" (still in progress) is deliberately NOT in this
            # list -- it keeps polling like scheduling/running until it
            # settles into the real terminal "cancelled" state.
            case "$OP_STATUS" in
              failed|error|cancelled|skipped)
                echo "::error::start_compute operation ended in status '${OP_STATUS}' -- it will never become ready, aborting without wasting the psql confirmation budget on it."
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::start_compute operation did not reach 'finished' within 120s (last status: '${OP_STATUS}')."
              exit 1
            fi

            echo "start_compute operation status: ${OP_STATUS}, checking again in 4s..."
            sleep 4
          done

      - name: Confirm this run's own branch is reachable (final psql check, direct/non-pooled host only)
        env:
          PGCONNSTR: "postgresql://${{ steps.create.outputs.db_role }}:${{ env.DB_PASSWORD }}@${{ steps.create.outputs.db_host }}/${{ steps.create.outputs.db_name }}?sslmode=require"
          DB_HOST: ${{ steps.create.outputs.db_host }}
        run: |
          set -euo pipefail
          # Short, fixed final confirmation only -- the prior step's
          # 120s operations-poll is now the primary readiness mechanism;
          # this just absorbs any small residual DNS-propagation lag
          # Neon's own docs don't explicitly rule out even once the
          # compute itself reports "active" (they document no guaranteed
          # link between the two). 5 fixed attempts, 3s apart (~12s worst
          # case) -- proportionate to a confirmation step, not a primary
          # wait mechanism; no exponential backoff needed here since the
          # real waiting already happened in the operations-poll above.
          for i in 1 2 3 4 5; do
            if PSQL_STDERR=$(psql "$PGCONNSTR" -c "SELECT 1" 2>&1 >/dev/null); then
              echo "warm-up ok (attempt $i)"
              exit 0
            fi
            # Sanitize before ever printing: strip the full connection string
            # (host/password/role/dbname are all embedded together in this
            # one value) if it appears verbatim in psql's own error text --
            # defense in depth alongside GitHub's own ::add-mask:: on
            # DB_HOST/DB_PASSWORD (already registered in the create step,
            # which persists for the rest of this job's log stream), never
            # relying on masking alone. What remains is just the error
            # class/message, never a credential.
            SANITIZED_ERROR="${PSQL_STDERR//$PGCONNSTR/[connection string redacted]}"
            if [ "$i" -lt 5 ]; then
              echo "warm-up attempt $i failed, retrying in 3s. psql error: ${SANITIZED_ERROR}"
              sleep 3
            else
              echo "warm-up attempt $i (final) failed. psql error: ${SANITIZED_ERROR}"
              # One-off diagnostic on the final failure only, to distinguish
              # a GitHub-Actions-runner-side resolver issue (hypothesis B)
              # from genuine Neon-side DNS propagation lag beyond the
              # operations-poll's own "finished" signal (hypothesis A).
              # Never repeated per-attempt -- purely investigative, and the
              # answer won't meaningfully change attempt-to-attempt within
              # this same ~15s window. Neither hostnames nor the lookup
              # results here are credentials -- this is a throwaway test
              # branch already gated to same-repo PRs only, and DB_HOST is
              # already registered via ::add-mask:: from the create step
              # regardless, so it still renders as *** in the log even
              # though printing it is fine for this diagnostic.
              # Confirm or refute, before the DNS lookups below, whether
              # DB_HOST was ever a real hostname at all: Neon's own API
              # reference documents that connection_uris is OMITTED from
              # the branch-creation response whenever the parent branch
              # has more than one role or database -- jq's own null-
              # propagation would then make our .connection_uris[0]...
              # extraction silently yield the literal text "null" (never
              # an error), not a real host. Boolean-only check, never the
              # raw value -- if this hypothesis is wrong, DB_HOST could
              # be a real hostname that shouldn't be printed even here.
              if [ "$DB_HOST" = "null" ]; then
                echo "CONFIRMED: DB_HOST is the literal string 'null' -- connection_uris was absent from the branch-creation response."
              else
                echo "DB_HOST is NOT the literal string 'null' -- hypothesis needs revision. Length: ${#DB_HOST} characters."
              fi
              command -v dig >/dev/null 2>&1 || sudo apt-get update -y && sudo apt-get install -y dnsutils
              echo "Default-resolver lookup (getent hosts): $(getent hosts "$DB_HOST" 2>&1 || echo 'FAILED')"
              echo "Explicit public-resolver lookup (dig @8.8.8.8): $(dig +short "$DB_HOST" @8.8.8.8 2>&1 || echo 'FAILED')"
            fi
          done
          echo "::error::Ephemeral branch never became reachable (read-only SELECT 1) after 5 confirmation attempts, despite the operations-poll reporting the compute as ready."
          exit 1

  db-integration-tests:
    name: DB integration tests (same-repo PRs only)
    needs: provision-db
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: "placeholder-access-secret-at-least-32-chars-long"
      JWT_REFRESH_SECRET: "placeholder-refresh-secret-at-least-32-chars-long"
      JWT_OTP_SECRET: "placeholder-otp-secret-at-least-32-characters-long"
      JWT_RESET_SECRET: "placeholder-reset-secret-at-least-32-chars-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Build this run's own connection string (direct/non-pooled host only, never printed)
        env:
          DB_HOST: ${{ needs.provision-db.outputs.db_host }}
          DB_NAME: ${{ needs.provision-db.outputs.db_name }}
          DB_ROLE: ${{ needs.provision-db.outputs.db_role }}
          NEON_API_TOKEN: ${{ secrets.NEON_CI_TEST_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          BRANCH_ID: ${{ needs.provision-db.outputs.branch_id }}
        run: |
          set -euo pipefail
          # The password was never passed as a job output (see provision-db's
          # own comment) -- re-fetch it directly from the Neon API for this
          # exact branch id instead of re-deriving/guessing it.
          ROLE_RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/roles/${DB_ROLE}/reveal_password" \
            -H "Authorization: Bearer ${NEON_API_TOKEN}")
          DB_PASSWORD=$(echo "$ROLE_RESPONSE" | jq -r '.password')
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${DB_HOST}"
          echo "DATABASE_URL=postgresql://${DB_ROLE}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}?sslmode=require" >> "$GITHUB_ENV"
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - name: Run main test suite (quarantined tests excluded -- see tests/quarantine.config.js)
        run: npx jest --runInBand -t "$(node scripts/quarantinePattern.js exclude)"
      # tsc/lint/build are NOT repeated here -- they already run
      # unconditionally in the `checks` job for every PR event, same-repo
      # ones included, so re-running them here would just duplicate CI
      # minutes for zero new information.

  quarantine-tests:
    name: Quarantined tests (informational, non-blocking -- issues #6-#9)
    needs: provision-db
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: "placeholder-access-secret-at-least-32-chars-long"
      JWT_REFRESH_SECRET: "placeholder-refresh-secret-at-least-32-chars-long"
      JWT_OTP_SECRET: "placeholder-otp-secret-at-least-32-characters-long"
      JWT_RESET_SECRET: "placeholder-reset-secret-at-least-32-chars-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Build this run's own connection string (direct/non-pooled host only, never printed)
        env:
          DB_HOST: ${{ needs.provision-db.outputs.db_host }}
          DB_NAME: ${{ needs.provision-db.outputs.db_name }}
          DB_ROLE: ${{ needs.provision-db.outputs.db_role }}
          NEON_API_TOKEN: ${{ secrets.NEON_CI_TEST_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          BRANCH_ID: ${{ needs.provision-db.outputs.branch_id }}
        run: |
          set -euo pipefail
          ROLE_RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/roles/${DB_ROLE}/reveal_password" \
            -H "Authorization: Bearer ${NEON_API_TOKEN}")
          DB_PASSWORD=$(echo "$ROLE_RESPONSE" | jq -r '.password')
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${DB_HOST}"
          echo "DATABASE_URL=postgresql://${DB_ROLE}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}?sslmode=require" >> "$GITHUB_ENV"
      - name: Run ONLY the quarantined tests (issues #6-#9 -- see tests/quarantine.config.js)
        run: npx jest --runInBand -t "$(node scripts/quarantinePattern.js include)"

  # Runs regardless of whether provisioning or either test job succeeded,
  # failed, or was skipped -- the cleanup boundary is deleting the exact
  # branch id this run itself created, nothing broader. A cleanup failure
  # fails/reports only this job, never deletes anything beyond that one id.
  #
  # Gated on the branch_id OUTPUT existing, never on provision-db's own
  # overall job result: branch creation is one early step in that job,
  # warm-up is a later, separate step -- a branch created successfully by
  # the first step still costs real Neon resources and must be deleted
  # even when a later step (warm-up) fails and makes the whole job's own
  # result "failure". Job outputs set via $GITHUB_OUTPUT persist even when
  # a later step in the same job fails, so this check is reliable.
  cleanup-db:
    name: Delete this run's own ephemeral Neon branch
    needs: [provision-db, db-integration-tests, quarantine-tests]
    if: always() && needs.provision-db.outputs.branch_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch by exact stored id (never a name search)
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_CI_TEST_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
          BRANCH_ID: ${{ needs.provision-db.outputs.branch_id }}
        run: |
          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/delete_response.json -w "%{http_code}" -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_TOKEN}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Failed to delete ephemeral branch ${BRANCH_ID} (HTTP ${HTTP_STATUS}). This run's branch may be orphaned -- naming convention ci-pr-${{ github.event.number }}-${{ github.run_id }} makes it identifiable for manual cleanup. Not attempting any broader deletion."
            cat /tmp/delete_response.json
            exit 1
          fi
          echo "Deleted ephemeral branch ${BRANCH_ID}."
